<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="PHP_9920 - Web Development Learning Portal">
    <title>PHP_9920 | Web Development Learning Portal</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <style>
        body {
            background: #f4f6fb;
            font-family: Arial, sans-serif;
            color: #243047;
        }
        .hero {
            background: linear-gradient(135deg, #14213d, #1d4e89);
            color: white;
            padding: 55px 20px;
            border-radius: 0 0 30px 30px;
        }
        .profile-img {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            border: 4px solid white;
            object-fit: cover;
            background: white;
        }
        .page-card {
            border: none;
            border-radius: 14px;
            transition: transform .2s, box-shadow .2s;
            height: 100%;
            box-shadow: 0 3px 12px rgba(0,0,0,.05);
        }
        .page-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0,0,0,.12);
        }
        .page-icon {
            font-size: 28px;
            color: #1d4e89;
        }
        .search-box {
            max-width: 600px;
            margin: auto;
        }
        footer {
            color: #8490a5;
            padding: 30px;
        }
    </style>
</head>

<body>
<header class="hero text-center">
    <img class="profile-img mb-3"
         src="https://github.com/WaySpaceOrg.png"
         alt="WaySpaceOrg profile">

    <h2>WaySpaceOrg</h2>
    <p class="mb-2">Web Development Learning</p>

    <h1 class="fw-bold mt-4">PHP_9920</h1>
    <p>Web Development Learning Portal</p>

    <a href="https://github.com/WaySpaceOrg/PHP_9920"
       target="_blank" rel="noopener noreferrer"
       class="btn btn-light mt-2">
        <i class="bi bi-github"></i> View GitHub Repository
    </a>

    <a href="about.html" class="btn btn-outline-light mt-2 ms-2">
        <i class="bi bi-person-circle"></i> เกี่ยวกับฉัน
    </a>
</header>

<main class="container py-5">
    <div class="text-center mb-4">
        <h3 class="fw-bold">บทเรียนและแบบฝึกหัด</h3>
        <p class="text-secondary">เลือกบทเรียนที่ต้องการเปิด หรือค้นหาจากชื่อไฟล์</p>
    </div>

    <div class="search-box mb-4">
        <input type="search" id="searchInput" class="form-control form-control-lg"
               placeholder="ค้นหาบทเรียน เช่น BMI, ex1, Lesson2..."
               aria-label="ค้นหาบทเรียน">
    </div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <span class="text-secondary"><i class="bi bi-grid"></i> Available Pages</span>
        <span class="badge bg-primary" id="pageCount">0 Pages</span>
    </div>

    <div class="row g-4" id="pageContainer"></div>
</main>

<footer class="text-center">
    <p class="mb-1">PHP_9920 Web Portal</p>
    <small>Created by WaySpaceOrg | Powered by GitHub</small>
</footer>

<script>
    // รายการไฟล์ HTML ที่มีอยู่จริงใน Repository PHP_9920
    // เพิ่มรายการใหม่ใน array นี้เมื่อมีแบบฝึกหัดเพิ่มเข้ามา
    const pages = [
        { path: "Lesson1/ex1.html", title: "ประวัติส่วนตัว", lesson: "Lesson 1 · HTML พื้นฐาน" },
        { path: "Lesson1/ex2.html", title: "ร้านกาแฟแมวเหมียว", lesson: "Lesson 1 · รูปภาพและลิงก์" },
        { path: "Lesson1/ex3.html", title: "ตารางข้อมูล", lesson: "Lesson 1 · HTML Table" },
        { path: "Lesson1/ex4.html", title: "ฟอร์มเข้าสู่ระบบ", lesson: "Lesson 1 · HTML Form" },

        { path: "Lesson2/ex1.html", title: "โปรไฟล์ของฉัน", lesson: "Lesson 2 · Semantic HTML" },
        { path: "Lesson2/ex2.html", title: "เมนูอาหาร", lesson: "Lesson 2 · Table" },
        { path: "Lesson2/ex3.html", title: "จองโต๊ะ", lesson: "Lesson 2 · Form" },
        { path: "Lesson2/ex4.html", title: "คาเฟ่แมวเหมียว", lesson: "Lesson 2 · Navigation" },
        { path: "Lesson2/ex5.html", title: "โครงสร้างเว็บไซต์", lesson: "Lesson 2 · Sitemap" },
        { path: "Lesson2/ex6.html", title: "บ้านแมวเหมียว", lesson: "Lesson 2 · List และ Form" },

        { path: "Lesson3/ex1.html", title: "JavaScript ตัวแรก", lesson: "Lesson 3 · Variables" },
        { path: "Lesson3/ex2.html", title: "เปลี่ยนข้อความด้วย JavaScript", lesson: "Lesson 3 · DOM" },
        { path: "Lesson3/ex3.html", title: "ระบบกดถูกใจ", lesson: "Lesson 3 · Event" },
        { path: "Lesson3/ex4.html", title: "เครื่องคำนวณ BMI", lesson: "Lesson 3 · Condition และ Calculation" },
        { path: "Lesson3/ex5.html", title: "เซียมซีร้านกาแฟ", lesson: "Lesson 3 · Random" },
        { path: "Lesson3/ex6.html", title: "โหมดกลางคืน", lesson: "Lesson 3 · Class และ DOM" }
    ];

    const pageContainer = document.getElementById("pageContainer");
    const pageCount = document.getElementById("pageCount");
    const searchInput = document.getElementById("searchInput");

    function renderPages(items) {
        pageCount.textContent = items.length + " Pages";

        if (items.length === 0) {
            pageContainer.innerHTML = `
                <div class="col-12 text-center text-secondary py-5">
                    <i class="bi bi-search fs-1"></i>
                    <p class="mt-3">ไม่พบบทเรียนที่ค้นหา</p>
                </div>`;
            return;
        }

        pageContainer.innerHTML = items.map(page => {
            const href = page.path.split("/")
                .map(part => encodeURIComponent(part))
                .join("/");
            const filename = page.path.split("/").pop();

            return `
                <div class="col-md-4 col-sm-6">
                    <div class="card page-card">
                        <div class="card-body p-4">
                            <div class="page-icon mb-3">
                                <i class="bi bi-filetype-html"></i>
                            </div>
                            <h5 class="fw-bold">${escapeHTML(page.title)}</h5>
                            <p class="text-secondary small mb-1">${escapeHTML(page.lesson)}</p>
                            <p class="text-secondary small">${escapeHTML(page.path)}</p>
                            <a href="${href}" class="btn btn-outline-primary w-100">
                                เปิดบทเรียน <i class="bi bi-arrow-up-right"></i>
                            </a>
                        </div>
                    </div>
                </div>`;
        }).join("");
    }

    function escapeHTML(value) {
        return String(value).replace(/[&<>"']/g, char => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#039;"
        })[char]);
    }

    searchInput.addEventListener("input", function () {
        const keyword = this.value.trim().toLocaleLowerCase("th");
        const filtered = pages.filter(page =>
            (page.title + " " + page.lesson + " " + page.path)
                .toLocaleLowerCase("th")
                .includes(keyword)
        );
        renderPages(filtered);
    });

    renderPages(pages);
</script>
</body>
</html>
