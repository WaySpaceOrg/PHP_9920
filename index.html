
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PHP_7014 | Web Portal</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <style>
        body {
            background: #f4f6fb;
            font-family: Arial, sans-serif;
            color: #243047;
        }

        .hero {
            background: linear-gradient(135deg, #14213d, #1d4e89);
            color: white;
            padding: 55px 20px;
            border-radius: 0 0 30px 30px;
        }

        .profile-img {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            border: 4px solid white;
            object-fit: cover;
            background: white;
        }

        .page-card {
            border: none;
            border-radius: 14px;
            transition: .2s;
            height: 100%;
            box-shadow: 0 3px 12px rgba(0,0,0,.05);
        }

        .page-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0,0,0,.12);
        }

        .page-icon {
            font-size: 28px;
            color: #1d4e89;
        }

        .search-box {
            max-width: 600px;
            margin: auto;
        }

        footer {
            color: #8490a5;
            padding: 30px;
        }
    </style>
</head>

<body>

<!-- HEADER -->
<header class="hero text-center">
    <img id="ownerAvatar" class="profile-img mb-3"
         src="https://github.com/WaySpaceOrg.png"
         alt="Repository Owner">

    <h2 id="ownerName">Loading...</h2>

    <p class="mb-2">Repository Owner</p>

    <h1 class="fw-bold mt-4">PHP_7014</h1>
    <p>Web Development Learning Portal</p>

    <a href="https://github.com/WaySpaceOrg/PHP_7014"
       target="_blank"
       class="btn btn-light mt-2">
        <i class="bi bi-github"></i> View GitHub Repository
    </a>
</header>

<!-- MAIN -->
<main class="container py-5">

    <div class="text-center mb-4">
        <h3 class="fw-bold">My Web Pages</h3>
        <p class="text-secondary">
            Select a page to explore
        </p>
    </div>

    <!-- SEARCH -->
    <div class="search-box mb-4">
        <input type="text" id="searchInput"
               class="form-control form-control-lg"
               placeholder="Search pages...">
    </div>

    <!-- COUNTER -->
    <div class="d-flex justify-content-between mb-3">
        <span class="text-secondary">
            <i class="bi bi-grid"></i>
            Available Pages
        </span>

        <span class="badge bg-primary" id="pageCount">0 Pages</span>
    </div>

    <!-- PAGE LIST -->
    <div class="row g-4" id="pageContainer">

        <div class="col-12 text-center py-5">
            <div class="spinner-border text-primary"></div>
            <p class="mt-3">Loading pages from GitHub...</p>
        </div>

    </div>

</main>

<footer class="text-center">
    <p class="mb-1">
        PHP_7014 Web Portal
    </p>
    <small>
        Created by <span id="footerOwner">WaySpaceOrg</span>
        | Powered by GitHub
    </small>
</footer>

<script>

// ======================================
// CONFIGURATION
// ======================================

const OWNER = "WaySpaceOrg";
const REPO = "PHP_7014";

let allPages = [];

// ======================================
// LOAD REPOSITORY INFORMATION
// ======================================

async function loadRepository() {

    try {

        // Repository information
        const repoResponse = await fetch(
            `https://api.github.com/repos/${OWNER}/${REPO}`
        );

        if (!repoResponse.ok) {
            throw new Error("Cannot access repository");
        }

        const repoData = await repoResponse.json();

        // Owner information
        let ownerData = repoData.owner;

        try {
            const profileResponse = await fetch(
                `https://api.github.com/users/${OWNER}`
            );

            if (profileResponse.ok) {
                ownerData = await profileResponse.json();
            }
        } catch (error) {
            console.log("Using repository owner information");
        }

        const displayName = ownerData.name || ownerData.login;

        document.getElementById("ownerName").textContent = displayName;

        document.getElementById("ownerAvatar").src =
            ownerData.avatar_url || repoData.owner.avatar_url;

        document.getElementById("footerOwner").textContent = displayName;

        // Repository file tree
        await loadPages(repoData.default_branch);

    } catch (error) {

        document.getElementById("pageContainer").innerHTML = `
            <div class="col-12">
                <div class="alert alert-danger">
                    <i class="bi bi-exclamation-triangle"></i>
                    ${error.message}
                    <br>
                    Please check repository visibility and GitHub API access.
                </div>
            </div>
        `;

    }
}

// ======================================
// LOAD ALL WEB PAGES
// ======================================

async function loadPages(branch) {

    const response = await fetch(
        `https://api.github.com/repos/${OWNER}/${REPO}/git/trees/${encodeURIComponent(branch)}?recursive=1`
    );

    if (!response.ok) {
        throw new Error("Cannot load repository files");
    }

    const data = await response.json();

    if (data.truncated) {
        throw new Error("Repository file tree is too large to load completely");
    }

    // Find HTML and PHP files
    allPages = data.tree.filter(file => {

        if (file.type !== "blob") return false;

        const path = file.path.toLowerCase();

        const isPage =
            /\.(html|htm|php)$/.test(path);

        const excluded =
            /(^|\/)(vendor|node_modules|includes|include|assets|css|js|images|img|uploads|storage|\.git)(\/|$)/.test(path);

        const isIndex =
            path === "index.html" ||
            path === "index.php";

        return isPage && !excluded && !isIndex;

    });

    renderPages(allPages);

}

// ======================================
// RENDER PAGE CARDS
// ======================================

function renderPages(pages) {

    const container = document.getElementById("pageContainer");

    document.getElementById("pageCount").textContent =
        pages.length + " Pages";

    if (pages.length === 0) {

        container.innerHTML = `
            <div class="col-12 text-center text-secondary py-5">
                No pages found.
            </div>
        `;

        return;
    }

    container.innerHTML = pages.map(page => {

        const filename = page.path.split("/").pop();

        const extension = filename.split(".").pop().toUpperCase();

        const icon = extension === "PHP"
            ? "bi-filetype-php"
            : "bi-filetype-html";

        // Relative path to open page
        const href = page.path.split("/")
            .map(part => encodeURIComponent(part))
            .join("/");

        return `
            <div class="col-md-4 col-sm-6">
                <div class="card page-card">
                    <div class="card-body p-4">

                        <div class="page-icon mb-3">
                            <i class="bi ${icon}"></i>
                        </div>

                        <h5 class="fw-bold">
                            ${escapeHTML(filename)}
                        </h5>

                        <p class="text-secondary small">
                            ${escapeHTML(page.path)}
                        </p>

                        <a href="${href}"
                           class="btn btn-outline-primary w-100"
                           target="_blank">
                            Open Page
                            <i class="bi bi-arrow-up-right"></i>
                        </a>

                    </div>
                </div>
            </div>
        `;

    }).join("");

}

// ======================================
// SEARCH
// ======================================

document.getElementById("searchInput")
.addEventListener("input", function() {

    const keyword = this.value.toLowerCase();

    const filtered = allPages.filter(page =>
        page.path.toLowerCase().includes(keyword)
    );

    renderPages(filtered);

});

// ======================================
// HTML ESCAPE
// ======================================

function escapeHTML(text) {

    return text.replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
    })[char]);

}

// ======================================
// START
// ======================================

loadRepository();

</script>

</body>
</html>
