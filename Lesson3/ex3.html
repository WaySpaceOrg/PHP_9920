<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>ถูกใจ</title>
</head>
<body>
    <h1>น้องส้มนอนกลางวัน</h1>
    <button id="like">❤️ ถูกใจ</button>
    <span id="count">0</span>
    <p id="badge"></p>

    <script>
        // นับยอดไลก์ทุกครั้งที่กดปุ่ม
document.getElementById("like").addEventListener("click", function () {
    // โค้ดตรงนี้รันทุกครั้งที่กด
  	const countElem = document.getElementById("count");
  	let count = Number(countElem.textContent);
  	count++;
    if (count >= 10) {
        document.getElementById("badge").textContent = "ยอดนิยม";
    }
  	countElem.textContent = count;
});
    </script>
</body>
</html>
