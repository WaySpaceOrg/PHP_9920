<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>ป้ายราคา</title>
</head>
<body>
    <h1>ลาเต้เย็น</h1>
    <p>ราคาแก้วละ <span id="price">45</span> บาท</p>
    <p>จำนวน <input id="qty" value="3"> แก้ว</p>
    <p id="total"></p>

    <script>
        // อ่านราคาและจำนวน แล้วเขียนผลรวมลงใน #total
      	const price = Number(document.getElementById("price").textContent);
				const qty = Number(document.getElementById("qty").value);
      	document.getElementById("total").textContent = "รวม " + (price * qty) + " บาท";
      	console.log(qty);
    </script>
</body>
</html>
