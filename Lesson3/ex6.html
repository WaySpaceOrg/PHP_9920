
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>โหมดกลางคืน</title>
    <style>
        body.dark {
            background: #111827;
            color: #e5e7eb;
        }
    </style>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><style>body{background:#f4f6fb;color:#243047;font-family:Arial,sans-serif;min-height:100vh}.lesson-hero{background:linear-gradient(135deg,#14213d,#1d4e89);color:white;padding:24px 18px;border-radius:0 0 24px 24px}.lesson-shell{max-width:1000px}.lesson-panel{background:white;border:0;border-radius:16px;padding:clamp(20px,4vw,36px);box-shadow:0 3px 14px rgba(0,0,0,.06);overflow-wrap:anywhere}.lesson-panel img{max-width:100%;height:auto}.lesson-panel table{width:100%;border-collapse:collapse;margin:1rem 0}.lesson-panel th,.lesson-panel td{border:1px solid #dee2e6;padding:10px 12px}.lesson-panel th{background:#eaf1fb}.lesson-panel input:not([type=checkbox]):not([type=radio]),.lesson-panel select,.lesson-panel textarea{max-width:100%;padding:.5rem .7rem;border:1px solid #ced4da;border-radius:.5rem;margin:.25rem}.lesson-panel button{border:0;border-radius:.5rem;padding:.55rem 1rem;background:#1d4e89;color:white;cursor:pointer}.lesson-panel a{color:#1d4e89}.lesson-nav a{text-decoration:none}.lesson-footer{color:#8490a5}</style></head>
<body><header class="lesson-hero"><div class="container lesson-shell"><div class="d-flex flex-wrap justify-content-between align-items-center gap-3"><div><div class="small opacity-75">PHP_9920 · WEB DEVELOPMENT</div><h1 class="h3 fw-bold mb-1">Lesson3 — โหมดกลางคืน</h1><div class="small opacity-75">บทเรียนที่ 16 จาก 16 แบบฝึกหัด</div></div><a href="../index.html" class="btn btn-light"><i class="bi bi-house-door"></i> กลับหน้าแรก</a></div><nav class="lesson-nav d-flex flex-wrap gap-2 mt-3"><a class="btn btn-outline-light btn-sm" href="../Lesson3/ex5.html"><i class='bi bi-arrow-left'></i> Lesson3 / เซียมซีร้านกาแฟ</a></nav></div></header><main class="container lesson-shell py-4 py-md-5"><section class="lesson-panel">
    <h1>ร้านกาแฟแมวเหมียว</h1>
    <button id="mode">โหมดกลางคืน</button>

    <script>
        // สลับ class dark ที่ body และเปลี่ยนข้อความบนปุ่ม
        document.getElementById("mode").addEventListener("click", function () {

            // สลับ class dark
            document.body.classList.toggle("dark");

            // ตรวจสอบว่าเป็นโหมดกลางคืนหรือไม่
            if (document.body.classList.contains("dark")) {
                document.getElementById("mode").textContent = "โหมดกลางวัน";
            } else {
                document.getElementById("mode").textContent = "โหมดกลางคืน";
            }

        });
    </script>
</section><div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mt-4"><a href="../index.html" class="btn btn-primary"><i class="bi bi-house-door"></i> กลับหน้าแรก PHP_9920</a><span class="lesson-footer small">PHP_9920 Learning Portal</span></div></main></body>
</html>
