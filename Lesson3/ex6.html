
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>โหมดกลางคืน</title>
    <style>
        body.dark {
            background: #111827;
            color: #e5e7eb;
        }
    </style>
</head>
<body>
    <h1>ร้านกาแฟแมวเหมียว</h1>
    <button id="mode">โหมดกลางคืน</button>

    <script>
        // สลับ class dark ที่ body และเปลี่ยนข้อความบนปุ่ม
        document.getElementById("mode").addEventListener("click", function () {

            // สลับ class dark
            document.body.classList.toggle("dark");

            // ตรวจสอบว่าเป็นโหมดกลางคืนหรือไม่
            if (document.body.classList.contains("dark")) {
                document.getElementById("mode").textContent = "โหมดกลางวัน";
            } else {
                document.getElementById("mode").textContent = "โหมดกลางคืน";
            }

        });
    </script>
</body>
</html>
